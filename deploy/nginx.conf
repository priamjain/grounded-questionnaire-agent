# nginx sits in front of uvicorn so the app never binds a public port itself.
# TLS terminates at CloudFront; this listener only ever talks to CloudFront.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_cloudfront_forwarded_proto;

        # Server-sent events: no buffering, no timeout in the middle of a run.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
